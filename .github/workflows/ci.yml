name: MansooriKart CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  quality:
    name: Workspace quality gates
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node.js 26
        uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install workspace dependencies
        run: npm ci

      - name: One-shot format Phase J files
        if: github.event_name == 'push'
        shell: bash
        run: |
          npm run format
          if git diff --quiet; then
            echo "No formatting changes needed."
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add frontend/src/components/admin/AdminLayout.tsx \
                    frontend/src/components/ui/index.tsx \
                    frontend/src/pages/admin/CatalogImportsPage.tsx \
                    frontend/src/pages/admin/OrdersPage.tsx \
                    frontend/src/pages/admin/PricingPage.tsx \
                    frontend/src/pages/admin/ProductsPage.tsx \
                    frontend/src/services/admin/catalog.ts \
                    frontend/src/services/admin/catalogImports.ts \
                    frontend/src/services/admin/orders.ts
            git commit -m "chore: format Phase J admin files"
            git push
          fi

      - name: Check formatting
        run: npm run format:check

      - name: Run lint gate
        run: npm run lint

      - name: Typecheck frontend and backend
        run: npm run typecheck

      - name: Run frontend tests
        run: npm run test:frontend

      - name: Build frontend and backend
        run: npm run build

      - name: Run backend integration tests
        run: npm run test:backend
